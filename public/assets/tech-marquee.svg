<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="xMidYMid meet">
  <style>
    :root{ --bg1:#030B1E; --bg2:#081B3B; --glass:rgba(255,255,255,0.03); --glow:rgba(232,201,122,0.12); --text:#E6F0FF; }
    .container{fill:url(#g); stroke:rgba(255,255,255,0.04); stroke-width:1; rx:14; ry:14; filter:url(#f);}
    .card{font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; font-size:14px; fill:var(--text);}
    .badge{display:inline-flex; align-items:center;}

    .marquee-wrap{overflow:visible}
    /* Move content left-to-right smoothly: start at -50% and animate to 0% */
    .marquee{transform-box:fill-box; transform-origin:0 50%; animation: infiniteMarquee 24s linear infinite;}

    @keyframes infiniteMarquee{
      0%   { transform: translateX(-50%); }
      100% { transform: translateX(0%); }
    }

    .logo-circle{stroke:rgba(0,0,0,0.08); stroke-width:0.6}
    .badge-rect{rx:10; ry:10;}
    .label{font-weight:600; font-size:13px;}
    .sub{font-weight:500; font-size:11px; fill:rgba(230,240,255,0.8)}

    /* Hover glow when user hovers the image (works when SVG is opened directly) */
    .badge:hover{filter:drop-shadow(0 6px 18px rgba(120,160,255,0.08)) drop-shadow(0 2px 8px rgba(232,201,122,0.06));}

    /* Modern sans-serif with subtle glow accent on labels */
    .label, .sub { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
    .label { fill: #EAF4FF; text-shadow: 0 0 6px rgba(100,150,255,0.06);} 

    /* Respect prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      .marquee { animation: none; }
    }
  </style>

  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0%" stop-color="#030B1E"/>
      <stop offset="100%" stop-color="#081B3B"/>
    </linearGradient>

    <filter id="f" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feComposite in="b" in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded container -->
  <rect x="12" y="12" width="1176" height="96" class="container"/>

  <!-- Glow band -->
  <rect x="20" y="20" width="1160" height="80" rx="10" ry="10" fill="rgba(255,255,255,0.01)" />

  <!-- Marquee group: create copy twice for seamless loop -->
  <g class="marquee-wrap" transform="translate(24,60)">
    <g class="marquee">
      <g transform="translate(0,-36)">
        <!-- React Badge -->
        <g transform="translate(0,0)" class="badge">
          <rect x="0" y="0" width="210" height="64" fill="rgba(255,255,255,0.02)" class="badge-rect" />
          <g transform="translate(14,10)">
            <circle cx="18" cy="18" r="18" fill="#61DAFB" class="logo-circle" />
            <g transform="translate(18,18)" fill="none" stroke="#081B3B" stroke-width="1.6" stroke-linecap="round">
              <ellipse rx="11" ry="4" transform="rotate(30)" />
              <ellipse rx="11" ry="4" transform="rotate(-30)" />
              <ellipse rx="11" ry="4" transform="rotate(90)" />
            </g>
            <text x="48" y="22" class="label">React</text>
            <text x="48" y="40" class="sub">18.x</text>
          </g>
        </g>

        <!-- Vite Badge -->
        <g transform="translate(230,0)" class="badge">
          <rect x="0" y="0" width="170" height="64" fill="rgba(255,255,255,0.02)" class="badge-rect" />
          <g transform="translate(12,10)">
            <polygon points="14,6 26,32 36,6 24,0" fill="#646CFF" />
            <text x="58" y="22" class="label">Vite</text>
            <text x="58" y="40" class="sub">5.x</text>
          </g>
        </g>

        <!-- Pure CSS + JS Badge -->
        <g transform="translate(420,0)" class="badge">
          <rect x="0" y="0" width="200" height="64" fill="rgba(255,255,255,0.02)" class="badge-rect" />
          <g transform="translate(12,10)">
            <rect x="0" y="0" width="36" height="36" rx="6" fill="#E8C97A" />
            <text x="48" y="22" class="label">Pure CSS + JS</text>
            <text x="48" y="40" class="sub">Golden Glow</text>
          </g>
        </g>

        <!-- Web Audio API Badge -->
        <g transform="translate(660,0)" class="badge">
          <rect x="0" y="0" width="210" height="64" fill="rgba(255,255,255,0.02)" class="badge-rect" />
          <g transform="translate(12,10)">
            <rect x="0" y="0" width="36" height="36" rx="6" fill="#1E88E5" />
            <g transform="translate(18,18)" stroke="#081B3B" stroke-width="1.6" fill="none">
              <path d="M-8 0 Q -4 -8 0 0 Q 4 8 8 0"/>
            </g>
            <text x="48" y="22" class="label">Web Audio API</text>
            <text x="48" y="40" class="sub">Audio Engine</text>
          </g>
        </g>

        <!-- TypeScript Badge -->
        <g transform="translate(900,0)" class="badge">
          <rect x="0" y="0" width="170" height="64" fill="rgba(255,255,255,0.02)" class="badge-rect" />
          <g transform="translate(12,10)">
            <rect x="0" y="0" width="36" height="36" rx="6" fill="#3178C6" />
            <text x="48" y="22" class="label">TypeScript</text>
            <text x="48" y="40" class="sub">Typed</text>
          </g>
        </g>

      </g>

      <!-- duplicate sequence for continuous effect -->
      <g transform="translate(1200,0)">
        <g transform="translate(0,-36)">
          <g transform="translate(0,0)" class="badge">
            <rect x="0" y="0" width="210" height="64" fill="rgba(255,255,255,0.02)" class="badge-rect" />
            <g transform="translate(14,10)">
              <circle cx="18" cy="18" r="18" fill="#61DAFB" class="logo-circle" />
              <g transform="translate(18,18)" fill="none" stroke="#081B3B" stroke-width="1.6" stroke-linecap="round">
                <ellipse rx="11" ry="4" transform="rotate(30)" />
                <ellipse rx="11" ry="4" transform="rotate(-30)" />
                <ellipse rx="11" ry="4" transform="rotate(90)" />
              </g>
              <text x="48" y="22" class="label">React</text>
              <text x="48" y="40" class="sub">18.x</text>
            </g>
          </g>

          <g transform="translate(230,0)" class="badge">
            <rect x="0" y="0" width="170" height="64" fill="rgba(255,255,255,0.02)" class="badge-rect" />
            <g transform="translate(12,10)">
              <polygon points="14,6 26,32 36,6 24,0" fill="#646CFF" />
              <text x="58" y="22" class="label">Vite</text>
              <text x="58" y="40" class="sub">5.x</text>
            </g>
          </g>

          <g transform="translate(420,0)" class="badge">
            <rect x="0" y="0" width="200" height="64" fill="rgba(255,255,255,0.02)" class="badge-rect" />
            <g transform="translate(12,10)">
              <rect x="0" y="0" width="36" height="36" rx="6" fill="#E8C97A" />
              <text x="48" y="22" class="label">Pure CSS + JS</text>
              <text x="48" y="40" class="sub">Golden Glow</text>
            </g>
          </g>

          <g transform="translate(660,0)" class="badge">
            <rect x="0" y="0" width="210" height="64" fill="rgba(255,255,255,0.02)" class="badge-rect" />
            <g transform="translate(12,10)">
              <rect x="0" y="0" width="36" height="36" rx="6" fill="#1E88E5" />
              <g transform="translate(18,18)" stroke="#081B3B" stroke-width="1.6" fill="none">
                <path d="M-8 0 Q -4 -8 0 0 Q 4 8 8 0"/>
              </g>
              <text x="48" y="22" class="label">Web Audio API</text>
              <text x="48" y="40" class="sub">Audio Engine</text>
            </g>
          </g>

          <g transform="translate(900,0)" class="badge">
            <rect x="0" y="0" width="170" height="64" fill="rgba(255,255,255,0.02)" class="badge-rect" />
            <g transform="translate(12,10)">
              <rect x="0" y="0" width="36" height="36" rx="6" fill="#3178C6" />
              <text x="48" y="22" class="label">TypeScript</text>
              <text x="48" y="40" class="sub">Typed</text>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- Title overlay -->
  <text x="36" y="44" class="card" style="font-size:13px; fill:rgba(230,240,255,0.9);">Tech stack — continuous marquee</text>

</svg>
